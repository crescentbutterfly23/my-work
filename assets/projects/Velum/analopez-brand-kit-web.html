<title>AnaLopez Brand Kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&family=Italiana&family=Poppins:wght@200;300;400;500&display=swap">

<style>
:root{
  --ground:#F5F0EA; --surface:#EDE5DA; --surface-2:#E4DACB;
  --ink:#0D0D0C; --ink-2:#585C41; --ink-3:#8A8B77;
  --line:rgba(88,92,65,.20); --line-2:rgba(88,92,65,.34);
  --accent:#B8762A; --deep:#1C2417; --cacao:#492B17; --sand:#D6BD9A; --jazmin:#EDE5DA;
  --shadow:0 1px 2px rgba(28,36,23,.05), 0 8px 28px rgba(28,36,23,.06);
  --display:"Bodoni Moda",Georgia,"Times New Roman",serif;
  --sans:"Poppins",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  --reserved:"Italiana","Bodoni Moda",Georgia,serif;
  --step:clamp(1rem,.86rem + .6vw,1.06rem);
  --maxw:1180px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#131810; --surface:#1C2417; --surface-2:#232C1D;
    --ink:#EDE5DA; --ink-2:#AFB59A; --ink-3:#8A9078;
    --line:rgba(214,189,154,.16); --line-2:rgba(214,189,154,.30);
    --accent:#CE9445; --deep:#0D0D0C; --jazmin:#EDE5DA;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --ground:#131810; --surface:#1C2417; --surface-2:#232C1D;
  --ink:#EDE5DA; --ink-2:#AFB59A; --ink-3:#8A9078;
  --line:rgba(214,189,154,.16); --line-2:rgba(214,189,154,.30);
  --accent:#CE9445; --deep:#0D0D0C; --jazmin:#EDE5DA;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth; scroll-padding-top:5.2rem}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto} *{animation:none!important;transition:none!important}}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--sans); font-weight:300; font-size:var(--step); line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:var(--maxw); margin-inline:auto; padding-inline:clamp(1.1rem,4vw,2.6rem)}

/* ---------- top bar ---------- */
.bar{
  position:sticky; top:0; z-index:50; background:color-mix(in srgb,var(--ground) 88%,transparent);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
}
.bar-in{display:flex; align-items:center; gap:1.4rem; height:4.4rem}
.bar-mark{display:flex; align-items:center; gap:.7rem; margin-right:auto; min-width:0}
.bar-mark svg{height:1.35rem; width:auto; display:block; flex:none}
.bar-mark span{
  font-size:.62rem; letter-spacing:.3em; text-transform:uppercase;
  color:var(--ink-3); white-space:nowrap; font-weight:400;
}
@media (max-width:760px){.bar-mark span{display:none}}
nav.secs{display:flex; gap:1.15rem; overflow-x:auto; scrollbar-width:none}
nav.secs::-webkit-scrollbar{display:none}
nav.secs a{
  color:var(--ink-2); text-decoration:none; font-size:.72rem; letter-spacing:.13em;
  text-transform:uppercase; white-space:nowrap; padding:.3rem 0; border-bottom:1px solid transparent;
}
nav.secs a:hover,nav.secs a:focus-visible{color:var(--ink); border-bottom-color:var(--accent)}
@media (max-width:980px){nav.secs{display:none}}
.lang{display:flex; border:1px solid var(--line-2); border-radius:2px; overflow:hidden; flex:none}
.lang button{
  font-family:var(--sans); font-size:.68rem; letter-spacing:.16em; font-weight:400;
  padding:.4rem .62rem; background:none; border:0; color:var(--ink-2); cursor:pointer;
}
.lang button[aria-pressed="true"]{background:var(--ink); color:var(--ground)}
:focus-visible{outline:2px solid var(--accent); outline-offset:3px}

/* ---------- hero ---------- */
.hero{position:relative; background:var(--deep); color:var(--jazmin); overflow:hidden}
.hero-bg{position:absolute; inset:0; background-size:cover; background-position:center 30%; opacity:.16; filter:saturate(.35) contrast(.9)}
.hero-veil{position:absolute; inset:0; background:radial-gradient(120% 90% at 50% 42%, rgba(28,36,23,.72) 0%, rgba(28,36,23,.90) 55%, rgba(28,36,23,.97) 100%)}
.hero-in{position:relative; padding:clamp(4rem,11vw,7.5rem) 0 clamp(3rem,7vw,4.5rem); text-align:center}
.hero svg.lock{width:min(560px,78%); height:auto; margin-inline:auto; display:block}
.hero .sub{margin:1.9rem 0 0; font-size:.82rem; letter-spacing:.1em; color:var(--sand); font-weight:300}
.hero .tag{
  margin:2.6rem auto 0; font-family:var(--display); font-style:italic; font-weight:400;
  font-size:clamp(1.35rem,3.4vw,2rem); color:var(--jazmin); max-width:22ch; line-height:1.3;
}
.hero .endorse{margin:2.9rem 0 0; font-size:.6rem; letter-spacing:.34em; text-transform:uppercase; color:var(--sand); opacity:.75}

/* ---------- sections ---------- */
section{padding:clamp(3.4rem,7vw,5.4rem) 0; border-bottom:1px solid var(--line)}
section:last-of-type{border-bottom:0}
.eyebrow{
  font-size:.63rem; letter-spacing:.32em; text-transform:uppercase; color:var(--accent);
  font-weight:400; margin:0 0 .9rem;
}
h2{
  font-family:var(--display); font-weight:400; font-size:clamp(1.85rem,4vw,2.7rem);
  line-height:1.12; margin:0 0 .55rem; text-wrap:balance; letter-spacing:-.01em;
}
h3{font-family:var(--display); font-weight:500; font-size:1.16rem; line-height:1.25; margin:0 0 .4rem; letter-spacing:-.005em}
.lede{max-width:62ch; color:var(--ink-2); margin:0 0 2.4rem}
p{margin:0 0 1rem; max-width:66ch}
.note{font-size:.86rem; color:var(--ink-2)}
.mono-label{font-size:.63rem; letter-spacing:.28em; text-transform:uppercase; color:var(--ink-3); font-weight:400}

.grid{display:grid; gap:1.15rem}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
@media (max-width:900px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))} .g6{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.g2,.g3,.g4{grid-template-columns:1fr} .g6{grid-template-columns:repeat(2,minmax(0,1fr))}}

.card{background:var(--surface); padding:1.5rem; border-radius:2px}
.panel{background:var(--surface); border-radius:2px; padding:clamp(1.4rem,3vw,2.2rem)}
.panel figure{margin-top:1rem}

/* lockups */
.lockcard{background:var(--surface); border-radius:2px; padding:1.7rem 1.5rem 1.4rem; display:flex; flex-direction:column}
.lockcard .art{min-height:110px; display:flex; align-items:center; justify-content:flex-start; margin-bottom:1.2rem}
.lockcard .art svg{max-width:100%; height:auto; display:block}
.lockcard.wide .art svg{width:100%}
.lockcard.tall .art svg{height:104px; width:auto}
.lockcard .meta{font-size:.8rem; color:var(--ink-2); margin:0}
.spec{font-size:.72rem; color:var(--ink-3); margin-top:.5rem; font-variant-numeric:tabular-nums}

/* colour versions */
.cw{border-radius:2px; aspect-ratio:1/.86; display:flex; align-items:center; justify-content:center; border:1px solid var(--line)}
.cw svg{height:52%; width:auto}
.cwlab{margin-top:.5rem; font-size:.74rem; line-height:1.35}
.cwlab b{font-weight:500; display:block}
.cwlab span{color:var(--ink-3); font-size:.68rem}

/* palette */
.sw{border-radius:2px; overflow:hidden; border:1px solid var(--line); background:var(--surface)}
.sw .chip{height:104px}
.sw .body{padding:.75rem .8rem .9rem}
.sw .nm{font-family:var(--display); font-size:1rem; font-weight:500; line-height:1.2}
.sw .hex{font-size:.72rem; color:var(--cacao); font-variant-numeric:tabular-nums; margin-top:.25rem}
:root[data-theme="dark"] .sw .hex,
:root:not([data-theme="light"]) .sw .hex{color:var(--accent)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .sw .hex{color:var(--cacao)}}
.sw .num{font-size:.66rem; color:var(--ink-3); font-variant-numeric:tabular-nums; line-height:1.5}
.sw .role{font-size:.7rem; color:var(--ink-2); margin-top:.5rem; line-height:1.45}

/* proportion */
.prop{display:flex; flex-direction:column; gap:.75rem}
.prow{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:1.2rem; align-items:center}
.pbar{height:2.5rem; border:1px solid var(--line); border-radius:2px}
.pmeta{display:flex; gap:1rem; align-items:baseline; min-width:min(58%,30rem)}
.pmeta .pct{font-family:var(--display); font-size:1.2rem; font-variant-numeric:tabular-nums; min-width:2.9rem}
.pmeta .pn{font-weight:500; font-size:.85rem}
.pmeta .pu{color:var(--ink-2); font-size:.78rem}
@media (max-width:700px){.prow{grid-template-columns:1fr; gap:.45rem} .pmeta{min-width:0}}

/* type */
.spec-card{background:var(--surface); border-radius:2px; padding:1.6rem 1.5rem}
.aa{font-size:clamp(3.2rem,7vw,4.4rem); line-height:1; margin:0 0 1.1rem; font-weight:400}
.alpha{font-size:.82rem; color:var(--ink-2); word-spacing:.06em; margin:.5rem 0 .9rem; line-height:1.5}
table{width:100%; border-collapse:collapse; font-size:.85rem}
.tablewrap{overflow-x:auto}
th{
  text-align:left; font-size:.63rem; letter-spacing:.26em; text-transform:uppercase;
  color:var(--accent); font-weight:400; padding:0 1.1rem .7rem 0; white-space:nowrap;
}
td{padding:.62rem 1.1rem .62rem 0; border-top:1px solid var(--line); vertical-align:top; color:var(--ink-2)}
td:first-child{font-family:var(--display); font-size:1rem; color:var(--ink); white-space:nowrap}
td.tnum{font-variant-numeric:tabular-nums; white-space:nowrap}

/* media tiles */
figure{margin:0}
figure img{width:100%; height:auto; display:block; border-radius:2px; background:var(--surface)}
figure img.sq{aspect-ratio:1/1; object-fit:cover}
figure img.ph{aspect-ratio:4/3; object-fit:cover}
figcaption{margin-top:.65rem; font-size:.78rem; color:var(--ink-2); line-height:1.5}
figcaption b{display:block; font-family:var(--display); font-size:1rem; font-weight:500; color:var(--ink); margin-bottom:.2rem}

/* illustrations */
.ill{background:var(--surface); border-radius:2px; padding:1rem; display:flex; align-items:center; justify-content:center; aspect-ratio:1/.92}
.ill svg{max-width:100%; max-height:100%; height:auto; width:auto; display:block}

/* do / dont */
.dd{border-radius:2px; padding:1.5rem}
.dd.do{background:var(--surface)}
.dd.dont{background:var(--surface-2)}
.dd ul{list-style:none; margin:.9rem 0 0; padding:0; display:flex; flex-direction:column; gap:.7rem}
.dd li{display:grid; grid-template-columns:1.15rem 1fr; gap:.55rem; font-size:.88rem; line-height:1.5; color:var(--ink)}
.dd li i{font-style:normal; color:var(--accent); font-size:1.05rem; line-height:1.35; text-align:center}
.dd.dont li i{color:var(--cacao); font-size:.95rem; line-height:1.5}
:root[data-theme="dark"] .dd.dont li i{color:var(--sand)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dd.dont li i{color:var(--sand)}}

/* callout */
.callout{border-left:2px solid var(--accent); padding:.15rem 0 .15rem 1.1rem; color:var(--ink-2); font-size:.9rem; max-width:62ch}
.quote{font-family:var(--display); font-style:italic; font-size:clamp(1.15rem,2.6vw,1.5rem); line-height:1.35; color:var(--ink); max-width:26ch}

/* outstanding */
ol.todo{counter-reset:t; list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:1.1rem}
ol.todo li{counter-increment:t; display:grid; grid-template-columns:2.2rem 1fr; gap:.9rem}
ol.todo li::before{content:counter(t,decimal-leading-zero); font-family:var(--reserved); font-size:1.35rem; color:var(--accent); line-height:1.1}
ol.todo p{margin:.25rem 0 0; font-size:.88rem; color:var(--ink-2)}

footer{background:var(--deep); color:var(--sand); padding:clamp(3rem,6vw,4.2rem) 0}
footer .f-in{display:flex; flex-wrap:wrap; gap:1.6rem; align-items:flex-end; justify-content:space-between}
footer svg{height:2rem; width:auto}
footer .fl{font-size:.62rem; letter-spacing:.3em; text-transform:uppercase; opacity:.7}
.hide{display:none!important}
</style>

const T = {"es": {"footer": "Manual de Marca", "cover_sub": "Casa de perfumer\u00eda y belleza  \u00b7  La Habana, Cuba", "tagline": "The scent of what remains.", "endorse_line": "Una casa VELUM", "house_t": "La Casa", "logo_t": "Identidad", "colour_t": "Color", "type_t": "Tipograf\u00eda", "texture_t": "Texturas", "ill_t": "Ilustraci\u00f3n", "apply_t": "Aplicaci\u00f3n", "kit_t": "El kit", "house_eye": "01 \u00b7 La Casa", "house_lede": "AnaLopez no crea perfumes inspirados en Cuba. Captura lugares, personas, momentos y emociones, y los convierte en experiencias olfativas. El jazm\u00edn es el primer cap\u00edtulo.", "origin_quote": "\u00abCada ma\u00f1ana ol\u00eda a jazm\u00edn.\u00bb", "origin_b": "En La Habana, junto al cuarto donde dorm\u00eda su fundador cuando era ni\u00f1o, crec\u00eda una planta de jazm\u00edn. A\u00f1os despu\u00e9s descubri\u00f3 que hab\u00eda pertenecido a su abuela, Ana. La planta desapareci\u00f3; el aroma qued\u00f3 en la memoria. Esa memoria es el origen de AnaLopez.", "values": [["Memoria", "Las historias personales son materia prima."], ["Herencia", "Se honra aquello que se transmite entre generaciones."], ["Cuba", "Origen, contexto y sensibilidad. No decoraci\u00f3n."], ["Ciencia", "Bioqu\u00edmica y biolog\u00eda molecular como base real."], ["Artesan\u00eda", "La f\u00f3rmula importa tanto como la historia."], ["Elegancia", "Refinada sin ser ostentosa."], ["Autenticidad", "La historia fundacional se mantiene verdadera."], ["Evoluci\u00f3n", "Nace del pasado, pero no queda atrapada en \u00e9l."]], "logo_eye": "02 \u00b7 Identidad", "logo_lede": "El logotipo es un dibujo propio, no una fuente. Parte de las letras de Italiana y sustituye la z final por la z con swash de Bodoni Moda Italic. El descriptor bloqueado debajo es Poppins ExtraLight con tracking de 0.30 em.", "logo_rule": "Nunca se reproduce escribiendo \u00abAnaLopez\u00bb en Italiana: faltar\u00eda el swash y el ajuste ser\u00eda incorrecto. Siempre se coloca el vecto const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let LANG = "en";
try { LANG = localStorage.getItem("al-lang") || "en"; } catch (e) {}
if (LANG !== "es" && LANG !== "en") LANG = "en";

const SECTIONS = [
  ["house","house_t"],["logo","logo_t"],["colour","colour_t"],
  ["type","type_t"],["texture","texture_t"],["ill","ill_t"],["apply","apply_t"],["kit","kit_t"]
];

function sec(id, t, eyebrow, title, lede) {
  const s = el("section"); s.id = id;
  const w = el("div", "wrap");
  w.appendChild(el("p", "eyebrow", esc(eyebrow)));
  w.appendChild(el("h2", null, esc(title)));
  if (lede) w.appendChild(el("p", "lede", esc(lede)));
  s.appendChild(w);
  return { s, w };
}

function render() {
  const t = T[LANG];
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-t]").forEach(n => { n.textContent = t[n.dataset.t] || ""; });
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === LANG)));

  const nav = document.getElementById("nav");
  nav.innerHTML = "";
  SECTIONS.forEach(([id, key]) => {
    const a = el("a", null, esc(t[key])); a.href = "#" + id; nav.appendChild(a);
  });

  const m = document.getElementById("main");
  m.innerHTML = "";

  /* ---- the house ---- */
  {
    const { s, w } = sec("house", t, t.house_eye, t.house_t, t.house_lede);
    const g = el("div", "grid g2");
    const left = el("div");
    left.appendChild(el("p", "quote", esc(t.origin_quote)));
    left.appendChild(el("p", null, esc(t.origin_b)));
    const right = el("div");
    right.appendChild(el("figure", null, '<img class="ph" src="' + ASSETS.ph1 + '" alt="">'));
    g.append(left, right); w.appendChild(g);

    const v = el("div", "grid g4"); v.style.marginTop = "2.6rem";
    t.values.forEach(([h, b]) => {

      c.appendChild(el("h3", null, esc(h)));
      c.appendChild(el("p", "note", esc(b)));
      v.appendChild(c);
    });
    w.appendChild(v);
    m.appendChild(s);
  }

  /* ---- logo ---- */
  {
    const { s, w } = sec("logo", t, t.logo_eye, t.logo_t, t.logo_lede);
    w.appendChild(el("p", "callout", esc(t.logo_rule)));

    const g = el("div", "grid g2"); g.style.marginTop = "2.2rem";
    const forms = [["primary","wide"],["wordmark","wide"],["stacked","tall"],["monogram","tall"]];
    forms.forEach(([f, cls], i) => {
      const c = el("div", "lockcard " + cls);
      c.appendChild(el("div", "art", ASSETS.logo[f]));
      c.appendChild(el("h3", null, esc(t.locks[i][0])));
      c.appendChild(el("p", "meta", esc(t.locks[i][1])));
      c.appendChild(el("p", "spec", esc(t.mins[i][1])));
      g.appendChild(c);
    });
    w.appendChild(g);

    w.appendChild(el("p", "eyebrow", esc(t.cw_eye)));
    document.querySelector; /* noop */
    const cwg = el("div", "grid g6");
    t.cw_pairs.forEach(([ground, ink]) => {
      const d = el("div");
      const box = el("div", "cw", ASSETS.logo_mono[ink]);
      box.style.background = PALETTE.find(p => p[0] === ground)[3];
      d.appendChild(box);
      d.appendChild(el("div", "cwlab", "<b>" + esc(t.pal_name[ground]) + "</b><span>" + esc(t.pal_name[ink]) + "</span>"));
      cwg.appendChild(d);
    });
    w.appendChild(cwg);
    w.appendChild(el("p", "note", esc(t.cw_b)));

    const dd = el("div", "grid g2"); dd.style.marginTop = "2.4rem";
    dd.appendChild(ddBlock("dont", t.misuse_h, t.misuse));
    const cs = el("div", "dd do");
    cs.appendChild(el("p", "mono-label", esc(t.clear_h)));
    cs.appendChild(el("p", "note", esc(t.clear_b)));
    const tw = el("div", "tablewrap");
    tw.appendChild(tbl([t.min_col1, t.min_col2], t.mins.map(r => [r[0], r[1]])));
    cs.appendChild(tw);
    dd.appendChild(cs);
    w.appendChild(dd);
    m.appendChild(s);
  }

  /* ---- colour ---- */
  {
    const { s, w } = sec("colour", t, t.colour_eye, t.colour_t, t.colour_lede);
    const g = el("div", "grid g4");
    PALETTE.forEach(([tok, es, en, hex, cmyk, rgb]) => {
      const d = el("div", "sw");
      const chip = el("div", "chip"); chip.style.background = hex; d.appendChild(chip);
      const b = el("div", "body");
      b.appendChild(el("div", "nm", esc(LANG === "es" ? es : en)));
      b.appendChild(el("div", "hex", hex.toUpperCase()));
      b.appendChild(el("div", "num", "CMYK " + cmyk + "<br>RGB " + rgb));
      b.appendChild(el("div", "role", esc(t.pal_role[tok])));
      d.appendChild(b); g.appendChild(d);
    });
    w.appendChild(g);

    w.appendChild(el("p", "eyebrow", esc(t.prop_h)));
    const pr = el("div", "prop");
    t.prop.forEach(([pct, nm, use, tok]) => {
      const row = el("div", "prow");
      const barwrap = el("div");
      const bar = el("div", "pbar");
      bar.style.width = pct; bar.style.background = PALETTE.find(p => p[0] === tok)[3];
      barwrap.appendChild(bar); row.appendChild(barwrap);
      row.appendChild(el("div", "pmeta",
        '<span class="pct">' + esc(pct) + '</span><span><span class="pn">' + esc(nm) +
        '</span><br><span class="pu">' + esc(use) + '</span></span>'));
      pr.appendChild(row);
    });
    w.appendChild(pr);
    const nv = el("div"); nv.style.marginTop = "2rem";
    nv.appendChild(ddBlock("dont", t.never_h, t.prop_never));
    w.appendChild(nv);
    m.appendChild(s);
  }

  /* ---- type ---- */
  {
    const { s, w } = sec("type", t, t.type_eye, t.type_t, t.type_lede);
    const g = el("div", "grid g3");
    const faces = [["Italiana", "var(--reserved)", 400], ["Bodoni Moda", "var(--display)", 400], ["Poppins", "var(--sans)", 200]];
    faces.forEach(([nm, ff, wt], i) => {
      const c = el("div", "spec-card");
      const aa = el("p", "aa", "Aa"); aa.style.fontFamily = ff; aa.style.fontWeight = wt;
      c.appendChild(aa);
      c.appendChild(el("h3", null, esc(nm)));
      c.appendChild(el("p", "mono-label", esc(t.typ[i][1])));
      const al = el("p", "alpha", "ABCDEFGHIJKLM abcdefghijklm 0123456789");
      al.style.fontFamily = ff; al.style.fontWeight = wt; c.appendChild(al);
      c.appendChild(el("p", "note", esc(t.typ[i][2])));
      g.appendChild(c);
    });
    w.appendChild(g);
    const tw = el("div", "tablewrap"); tw.style.marginTop = "2.2rem";
    tw.appendChild(tbl(t.scale_h, t.scale, [false, false, true, true]));
    w.appendChild(tw);
    w.appendChild(el("p", "note", esc(t.typ_lic)));
    m.appendChild(s);
  }

  /* ---- textures ---- */
  {
    const { s, w } = sec("texture", t, t.texture_eye, t.texture_t, t.texture_lede);
    const g = el("div", "grid g6");
    t.tex.forEach(([nm, use], i) => {
      const f = el("figure", null, '<img class="sq" src="' + ASSETS.tex[i] + '" alt="">');
      f.appendChild(el("figcaption", null, "<b>" + esc(nm) + "</b>" + esc(use)));
      g.appendChild(f);
    });
    w.appendChild(g);
    const ov = el("div", "grid g2"); ov.style.marginTop = "2.2rem";
    t.tex_ov.forEach(([nm, d], i) => {
      const p = el("div", "panel");
      p.appendChild(el("h3", null, esc(nm)));
      p.appendChild(el("p", "note", esc(d)));
      p.appendChild(el("figure", null, '<img src="' + (i === 1 ? ASSETS.pat : ASSETS.ovl) + '" alt="">'));
      ov.appendChild(p);
    });
    w.appendChild(ov);
    const nv = el("div"); nv.style.marginTop = "2rem";
    nv.appendChild(ddBlock("dont", t.never_h, t.tex_never));
    w.appendChild(nv);
    m.appendChild(s);
  }

  /* ---- illustrations ---- */
  {
    const { s, w } = sec("ill", t, t.ill_eye, t.ill_t, t.ill_lede);
    const g = el("div", "grid g6");
    ASSETS.ill.forEach((svg, i) => {
      const d = el("div");
      d.appendChild(el("div", "ill", svg));
      d.appendChild(el("div", "cwlab", "<b>" + esc(t.ill_names[i]) + "</b>"));
      g.appendChild(d);
    });
    w.appendChild(g);
    const tw = el("div", "tablewrap"); tw.style.marginTop = "2rem";
    tw.appendChild(tbl([t.ill_col1, t.ill_col2], t.ill_use));
    w.appendChild(tw);
    const nv = el("div"); nv.style.marginTop = "1.6rem";
    nv.appendChild(ddBlock("dont", t.never_h, t.sym_rules_x));
    w.appendChild(nv);
    m.appendChild(s);
  }

  /* ---- application ---- */
  {
    const { s, w } = sec("apply", t, t.apply_eye, t.apply_t, t.apply_lede);
    const g = el("div", "grid g3");
    ["mk1", "mk2", "mk3"].forEach((k, i) => {
      const f = el("figure", null, '<img src="' + ASSETS[k] + '" alt="">');
      f.appendChild(el("figcaption", null, "<b>" + esc(t.app[i][0]) + "</b>" + esc(t.app[i][1])));
      g.appendChild(f);
    });
    w.appendChild(g);
    w.appendChild(el("p", "callout", esc(t.app_note)));

    const dd = el("div", "grid g2"); dd.style.marginTop = "2.4rem";
    dd.appendChild(ddBlock("do", t.art_do_h, t.art_do));
    dd.appendChild(ddBlock("dont", t.art_dont_h, t.art_dont));
    w.appendChild(dd);

    const v = el("div", "panel"); v.style.marginTop = "2.4rem";
    v.appendChild(el("p", "eyebrow", "VELUM"));
    v.appendChild(el("h3", null, esc(t.vel_h)));
    v.appendChild(el("p", "note", esc(t.vel_b)));
    const vg = el("div", "grid g2"); vg.style.marginTop = "1.2rem";
    vg.appendChild(ddBlock("do", t.vel_yes_h, t.vel_yes));
    vg.appendChild(ddBlock("dont", t.vel_no_h, t.vel_no));
    v.appendChild(vg);
    v.appendChild(el("p", "spec", esc(t.vel_spec)));
    w.appendChild(v);
    m.appendChild(s);
  }

  /* ---- kit ---- */
  {
    const { s, w } = sec("kit", t, t.kit_eye, t.kit_t, t.kit_lede);
    const tw = el("div", "tablewrap");
    tw.appendChild(tbl([t.kit_col1, t.kit_col2], t.kit_rows));
    w.appendChild(tw);
    w.appendChild(el("p", "eyebrow", esc(t.todo_h)));
    const ol = el("ol", "todo");
    t.todo.forEach(([h, b]) => {
      const li = el("li");
      const d = el("div");
      d.appendChild(el("h3", null, esc(h)));
      d.appendChild(el("p", null, esc(b)));
      li.appendChild(d); ol.appendChild(li);
    });
    w.appendChild(ol);
    m.appendChild(s);
  }
}

function ddBlock(kind, head, items) {
  const MARK = kind === "dont" ? "\u00d7" : "\u2022";
  const d = el("div", "dd " + kind);
  d.appendChild(el("p", "mono-label", esc(head)));
  const ul = el("ul");
  items.forEach(i => ul.appendChild(el("li", null, "<i aria-hidden=\"true\">" + MARK + "</i><span>" + esc(i) + "</span>")));
  d.appendChild(ul);
  return d;
}

function tbl(heads, rows, nums) {
  const tb = el("table");
  const tr = el("tr");
  heads.forEach(h => tr.appendChild(el("th", null, esc(h))));
  const th = el("thead"); th.appendChild(tr); tb.appendChild(th);
  const bd = el("tbody");
  rows.forEach(r => {
    const t2 = el("tr");
    r.forEach((c, i) => t2.appendChild(el("td", nums && nums[i] ? "tnum" : null, esc(c))));
    bd.appendChild(t2);
  });
  tb.appendChild(bd);
  return tb;
}

document.querySelectorAll(".lang button").forEach(b => {
  b.addEventListener("click", () => {
    LANG = b.dataset.lang;
    try { localStorage.setItem("al-lang", LANG); } catch (e) {}
    render();
  });
});
render();
</script>
