<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1279.97" height="720.00" viewBox="0 0 1279.97 720.00">
<title>AnaLopez EN page 34</title>
<rect x="0" y="0" width="1279.97" height="720.00" fill="#F5F0EA"/>
<text font-family="Poppins" font-size="14.00" font-weight="200" fill="#585C41" text-anchor="start" letter-spacing="4.200" xml:space="preserve">
<tspan x="86.40" y="70.52">APPLICATION</tspan>
</text>
<text font-family="Bodoni Moda" font-size="45.33" font-weight="400" fill="#0D0D0C" text-anchor="start" xml:space="preserve">
<tspan x="86.40" y="142.69">Voice and tagline</tspan>
</text>
<text font-family="Poppins" font-size="16.00" font-weight="300" fill="#585C41" text-anchor="start" xml:space="preserve">
<tspan x="86.40" y="189.38">Poetic, but precise. Emotional, but sophisticated. Cultural, but contemporary. Personal, but never</tspan>
<tspan x="86.40" y="214.98">sentimental.</tspan>
</text>
<rect x="86.40" y="254.40" width="528.00" height="144.00" fill="#EDE5DA"/>
<text font-family="Poppins" font-size="12.67" font-weight="200" fill="#B8762A" text-anchor="start" letter-spacing="3.293" xml:space="preserve">
<tspan x="120.00" y="292.36">BETTER</tspan>
</text>
<text font-family="Bodoni Moda" font-size="22.67" font-weight="400" fill="#0D0D0C" text-anchor="start" xml:space="preserve">
<tspan x="120.00" y="338.18">“Every morning it smelled of jasmine.”</tspan>
</text>
<rect x="648.00" y="254.40" width="545.28" height="144.00" fill="#D6BD9A" fill-opacity="0.300"/>
<text font-family="Poppins" font-size="12.67" font-weight="200" fill="#492B17" text-anchor="start" letter-spacing="3.293" xml:space="preserve">
<tspan x="681.60" y="292.36">THAN</tspan>
</text>
<text font-family="Poppins" font-size="17.33" font-weight="300" fill="#585C41" text-anchor="start" xml:space="preserve">
<tspan x="681.60" y="330.33">“A fragrance inspired by the magic of Cuba.”</tspan>
</text>
<text font-family="Poppins" font-size="12.67" font-weight="200" fill="#B8762A" text-anchor="start" letter-spacing="3.293" xml:space="preserve">
<tspan x="86.40" y="450.76">DESCRIPTOR</tspan>
</text>
<text font-family="Bodoni Moda" font-size="29.33" font-weight="400" fill="#0D0D0C" text-anchor="start" xml:space="preserve">
<tspan x="86.40" y="504.44">Aromas que Transportan</tspan>
</text>
<text font-family="Poppins" font-size="12.67" font-weight="200" fill="#B8762A" text-anchor="start" letter-spacing="3.293" xml:space="preserve">
<tspan x="648.00" y="450.76">TAGLINE</tspan>
</text>
<text font-family="Bodoni Moda" font-size="29.33" font-weight="400" fill="#492B17" text-anchor="start" font-style="italic" xml:space="preserve">
<tspan x="648.00" y="504.44">The scent of what remains.</tspan>
</text>
<text font-family="Poppins" font-size="14.00" font-weight="300" fill="#585C41" text-anchor="start" xml:space="preserve">
<tspan x="86.40" y="562.04">The descriptor lives in the lockup. The tagline lives in campaign, never inside the logotype. Neither is translated.</tspan>
</text>
<text font-family="Poppins" font-size="11.33" font-weight="300" fill="#585C41" text-anchor="start" xml:space="preserve">
<tspan x="86.40" y="686.14">AnaLopez  ·  Brand Guidelines</tspan>
</text>
<text font-family="Poppins" font-size="11.33" font-weight="300" fill="#585C41" text-anchor="end" xml:space="preserve">
<tspan x="1193.57" y="686.14">34</tspan>
</text>
</svg>