-family="Montserrat, Poppins, Arial, sans-serif" font-size="18.0" font-weight="400" fill="#55585F" opacity="0.78">Discover what lies beyond and turn it into</text><text x="222.0" y="548.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="18.0" font-weight="400" fill="#55585F" opacity="0.78">something that improves people's lives.</text><line x1="130.0" y1="598.0" x2="1790.0" y2="598.0" stroke="#0B1D34" stroke-width="0.70" opacity="0.12"/><text x="130.0" y="660.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="13.0" font-weight="600" fill="#B8912B" letter-spacing="2.00">02</text><text x="222.0" y="664.0" font-family="Cinzel, Cormorant Garamond, Georgia, serif" font-size="34.0" font-weight="400" fill="#0B1D34" letter-spacing="2.50">VISION</text><text x="222.0" y="708.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="18.0" font-weight="400" fill="#55585F" opacity="0.78">To be a reference group in the Caribbean: different</text><text x="222.0" y="738.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="18.0" font-weight="400" fill="#55585F" opacity="0.78">houses held together by one standard.</text><line x1="130.0" y1="788.0" x2="1790.0" y2="788.0" stroke="#0B1D34" stroke-width="0.70" opacity="0.12"/><text x="130.0" y="850.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="13.0" font-weight="600" fill="#B8912B" letter-spacing="2.00">03</text><text x="222.0" y="854.0" font-family="Cinzel, Cormorant Garamond, Georgia, serif" font-size="34.0" font-weight="400" fill="#0B1D34" letter-spacing="2.50">MISSION</text><text x="222.0" y="898.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="18.0" font-weight="400" fill="#55585F" opacity="0.78">Build and run businesses that connect</text><text x="222.0" y="928.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="18.0" font-weight="400" fill="#55585F" opacity="0.78">markets, cultures and opportunities.</text><line x1="130.0" 