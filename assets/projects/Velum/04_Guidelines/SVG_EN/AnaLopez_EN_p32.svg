<tspan x="1026.64" y="393.25">Pod. Warmth and</tspan>
<tspan x="1026.64" y="410.65">pleasure.</tspan>
</text>
<text font-family="Poppins" font-size="14.67" font-weight="300" fill="#585C41" text-anchor="start" xml:space="preserve">
<tspan x="86.40" y="490.91">Six subjects cover the whole universe of the house. Drawn as line art, at the</tspan>
<tspan x="86.40" y="513.64">same weight as the jasmine, on a 24 px grid.</tspan>
</text>
<text font-family="Poppins" font-size="12.67" font-weight="200" fill="#B8762A" text-anchor="start" letter-spacing="3.293" xml:space="preserve">
<tspan x="710.40" y="489.16">SPECIFICATION</tspan>
</text>
<text font-family="Poppins" font-size="13.33" font-weight="300" fill="#585C41" text-anchor="start" xml:space="preserve">
<tspan x="710.40" y="522.76">—  24 px grid, 1.5 px stroke</tspan>
</text>
<text font-family="Poppins" font-size="13.33" font-weight="300" fill="#585C41" text-anchor="start" xml:space="preserve">
<tspan x="710.40" y="555.40">—  Round caps, no fill</tspan>
</text>
<text font-family="Poppins" font-size="13.33" font-weight="300" fill="#585C41" text-anchor="start" xml:space="preserve">
<tspan x="710.40" y="588.04">—  One palette colour only</tspan>
</text>
<text font-family="Poppins" font-size="13.33" font-weight="300" fill="#585C41" text-anchor="start" xml:space="preserve">
<tspan x="710.40" y="620.68">—  Same visual weight as the drawn jasmine</tspan>
</text>
<text font-family="Poppins" font-size="12.67" font-weight="300" fill="#492B17" text-anchor="start" xml:space="preserve">
<tspan x="86.40" y="647.56">Outstanding: draw the six icons. Only the specification exists today.</tspan>
</text>
<text font-family="Poppins" font-size="11.33" font-weight="300" fill="#585C41" text-anchor="start" xml:space="preserve">
<tspan x="86.40" y="686.14">AnaLopez  ·  Brand Guidelines</tspan>
</text>
