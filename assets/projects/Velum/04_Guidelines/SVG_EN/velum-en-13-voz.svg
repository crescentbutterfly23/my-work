<rect width="1920" height="1080" fill="url(#gGround)"/><line x1="130.0" y1="78.0" x2="1790.0" y2="78.0" stroke="#0B1D34" stroke-width="0.80" opacity="0.28"/><text x="130.0" y="68.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="11.0" font-weight="600" fill="#B8912B" letter-spacing="3.40">01 — THE BRAND</text><text x="1790.0" y="68.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="11.0" font-weight="500" fill="#0B1D34" letter-spacing="3.40" text-anchor="end">BRAND GUIDELINES</text><line x1="130.0" y1="1006.0" x2="1790.0" y2="1006.0" stroke="#0B1D34" stroke-width="0.80" opacity="0.18"/><text x="130.0" y="1032.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="10.0" font-weight="500" fill="#0B1D34" letter-spacing="3.40">VELUM ENTERPRISE</text><text x="1790.0" y="1034.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="15.0" font-weight="600" fill="#0B1D34" letter-spacing="1.00" text-anchor="end">13</text><text x="1754.0" y="1034.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="15.0" font-weight="400" fill="#0B1D34" letter-spacing="1.00" text-anchor="end" opacity="0.40">/ 36</text><text x="130.0" y="210.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="12.0" font-weight="600" fill="#B8912B" letter-spacing="3.40">VOICE AND TONE</text><text x="130.0" y="300.0" font-family="Cinzel, Cormorant Garamond, Georgia, serif" font-size="52.0" font-weight="400" fill="#0B1D34" letter-spacing="2.50">HOW WE WRITE</text><text x="130.0" y="356.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="16.0" font-weight="400" fill="#55585F" opacity="0.78">Inspiring, sophisticated and close. We speak with vision, confidence and purpose;</text><text x="130.0" y="383.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="16.0" font-weight="400" fill="#55585F" opacity="0.78">we never need to shout to establish value.</text><line x1="130.0" y1="450.0" x2="1790.0" y2="450.0" stroke="#0B1D34" stroke-width="0.70" opacity="0.18"/><text x="130.0" y="520.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="10.0" font-weight="600" fill="#B8912B" letter-spacing="3.40">BETTER</text><text x="130.0" y="566.0" font-family="Cormorant Garamond, Georgia, serif" font-size="25.0" font-weight="400" fill="#0B1D34" font-style="italic">«There is a world behind every horizon.»</text><text x="1030.0" y="520.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="10.0" font-weight="600" fill="#8C5A3C" letter-spacing="3.40">WORSE</text><text x="1030.0" y="566.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="21.0" font-weight="400" fill="#55585F" opacity="0.85">«We are leaders across multiple industries.»</text><line x1="130.0" y1="606.0" x2="1790.0" y2="606.0" stroke="#0B1D34" stroke-width="0.70" opacity="0.12"/><text x="130.0" y="670.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="10.0" font-weight="600" fill="#B8912B" letter-spacing="3.40">BETTER</text><text x="130.0" y="716.0" font-family="Cormorant Garamond, Georgia, serif" font-size="25.0" font-weight="400" fill="#0B1D34" font-style="italic">«A space can become a destination.»</text><text x="1030.0" y="670.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="10.0" font-weight="600" fill="#8C5A3C" letter-spacing="3.40">WORSE</text><text x="1030.0" y="716.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="21.0" font-weight="400" fill="#55585F" opacity="0.85">«360° end-to-end solutions.»</text><line x1="130.0" y1="756.0" x2="1790.0" y2="756.0" stroke="#0B1D34" stroke-width="0.70" opacity="0.12"/><text x="130.0" y="820.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="10.0" font-weight="600" fill="#B8912B" letter-spacing="3.40">BETTER</text><text x="130.0" y="866.0" font-family="Cormorant Garamond, Georgia, serif" font-size="25.0" font-weight="400" fill="#0B1D34" font-style="italic">«Six houses, one standard.»</text><text x="1030.0" y="820.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="10.0" font-weight="600" fill="#8C5A3C" letter-spacing="3.40">WORSE</text><text x="1030.0" y="866.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="21.0" font-weight="400" fill="#55585F" opacity="0.85">«Synergies across our diversified portfolio.»</text><line x1="130.0" y1="906.0" x2="1790.0" y2="906.0" stroke="#0B1D34" stroke-width="0.70" opacity="0.12"/><text x="130.0" y="940.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="11.0" font-weight="600" fill="#B8912B" letter-spacing="3.40">RULES</text><text x="330.0" y="940.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="15.0" font-weight="400" fill="#55585F">— Short sentences. One idea per sentence.</text><text x="1130.0" y="940.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="15.0" font-weight="400" fill="#55585F">— Concrete before abstract: an example beats an adjective.</text><text x="330.0" y="974.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="15.0" font-weight="400" fill="#55585F">— No empty superlatives, no corporate jargon.</text><text x="1130.0" y="974.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="15.0" font-weight="400" fill="#55585F">— The name is written Velum, never VELUM in running text.</text></svg>