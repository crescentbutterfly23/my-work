<rect width="1920" height="1080" fill="url(#gGround)"/><line x1="130.0" y1="78.0" x2="1790.0" y2="78.0" stroke="#0B1D34" stroke-width="0.80" opacity="0.28"/><text x="130.0" y="68.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="11.0" font-weight="600" fill="#B8912B" letter-spacing="3.40">01 — THE BRAND</text><text x="1790.0" y="68.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="11.0" font-weight="500" fill="#0B1D34" letter-spacing="3.40" text-anchor="end">BRAND GUIDELINES</text><line x1="130.0" y1="1006.0" x2="1790.0" y2="1006.0" stroke="#0B1D34" stroke-width="0.80" opacity="0.18"/><text x="130.0" y="1032.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="10.0" font-weight="500" fill="#0B1D34" letter-spacing="3.40">VELUM ENTERPRISE</text><text x="1790.0" y="1034.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="15.0" font-weight="600" fill="#0B1D34" letter-spacing="1.00" text-anchor="end">11</text><text x="1754.0" y="1034.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="15.0" font-weight="400" fill="#0B1D34" letter-spacing="1.00" text-anchor="end" opacity="0.40">/ 36</text><text x="130.0" y="210.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="12.0" font-weight="600" fill="#B8912B" letter-spacing="3.40">THE SIX HOUSES</text><text x="130.0" y="300.0" font-family="Cinzel, Cormorant Garamond, Georgia, serif" font-size="52.0" font-weight="400" fill="#0B1D34" letter-spacing="2.50">ONE PARENT BRAND, SIX HOUSES</text><text x="130.0" y="356.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="16.0" font-weight="400" fill="#55585F" opacity="0.78">We do not say «we own a travel agency, a perfume house and a property firm».</text><text x="130.0" y="383.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="16.0" font-weight="400" fill="#55585F" opacity="0.78">We say: we create connections between different worlds.</text><line x1="130.0" y1="440.0" x2="1790.0" y2="440.0" stroke="#0B1D34" stroke-width="0.70" opacity="0.18"/><g transform="translate(130.0 486.0) scale(1.500)" fill="none" stroke="#B8912B" stroke-width="1.60" stroke-linecap="round" stroke-linejoin="round"><path d="M6 27 L42 17 M6 27 L18 31 L14 41 L20 33 L34 37 M42 17 L34 37"/></g><text x="130.0" y="622.0" font-family="Cinzel, Cormorant Garamond, Georgia, serif" font-size="24.0" font-weight="400" fill="#0B1D34" letter-spacing="2.00">VELUM TRAVEL</text><text x="130.0" y="656.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="15.0" font-weight="400" fill="#55585F">Travel and experiences</text><text x="130.0" y="686.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="13.0" font-weight="400" fill="#B8912B">Crosses · Borders and distances</text><line x1="130.0" y1="714.0" x2="623.3" y2="714.0" stroke="#0B1D34" stroke-width="0.70" opacity="0.14"/><g transform="translate(683.3 486.0) scale(1.500)" fill="none" stroke="#B8912B" stroke-width="1.60" stroke-linecap="round" stroke-linejoin="round"><path d="M19 6 h10 v7 h-10 z M17 13 h14 c3 6 4 9 4 14 v13 a4 4 0 0 1 -4 4 h-14 a4 4 0 0 1 -4 -4 v-13 c0 -5 1 -8 4 -14 z M19 26 h10"/></g><text x="683.3" y="622.0" font-family="Cinzel, Cormorant Garamond, Georgia, serif" font-size="24.0" font-weight="400" fill="#0B1D34" letter-spacing="2.00">AL — ANA LÓPEZ</text><text x="683.3" y="656.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="15.0" font-weight="400" fill="#55585F">Scents that carry you</text><text x="683.3" y="686.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="13.0" font-weight="400" fill="#B8912B">Crosses · The distance between scent and memory</text><line x1="683.3" y1="714.0" x2="1176.7" y2="714.0" stroke="#0B1D34" stroke-width="0.70" opacity="0.14"/><g transform="translate(1236.7 486.0) scale(1.500)" fill="none" stroke="#B8912B" stroke-width="1.60" stroke-linecap="round" stroke-linejoin="round"><path d="M6 39 h36 M10 39 a14 15 0 0 1 28 0 M2