<rect width="1920" height="1080" fill="url(#gGround)"/><line x1="130.0" y1="78.0" x2="1790.0" y2="78.0" stroke="#0B1D34" stroke-width="0.80" opacity="0.28"/><text x="130.0" y="68.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="11.0" font-weight="600" fill="#B8912B" letter-spacing="3.40">01 — LA MARCA</text><text x="1790.0" y="68.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="11.0" font-weight="500" fill="#0B1D34" letter-spacing="3.40" text-anchor="end">MANUAL DE MARCA</text><line x1="130.0" y1="1006.0" x2="1790.0" y2="1006.0" stroke="#0B1D34" stroke-width="0.80" opacity="0.18"/><text x="130.0" y="1032.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="10.0" font-weight="500" fill="#0B1D34" letter-spacing="3.40">VELUM ENTERPRISE</text><text x="1790.0" y="1034.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="15.0" font-weight="600" fill="#0B1D34" letter-spacing="1.00" text-anchor="end">06</text><text x="1754.0" y="1034.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="15.0" font-weight="400" fill="#0B1D34" letter-spacing="1.00" text-anchor="end" opacity="0.40">/ 36</text><text x="130.0" y="210.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="12.0" font-weight="600" fill="#B8912B" letter-spacing="3.40">VALORES</text><text x="130.0" y="300.0" font-family="Cinzel, Cormorant Garamond, Georgia, serif" font-size="52.0" font-weight="400" fill="#0B1D34" letter-spacing="2.50">LO QUE GOBIERNA CADA DECISIÓN</text><line x1="130.0" y1="400.0" x2="1790.0" y2="400.0" stroke="#0B1D34" stroke-width="0.70" opacity="0.18"/><text x="130.0" y="500.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="13.0" font-weight="600" fill="#B8912B" letter-spacing="2.00">01</text><text x="130.0" y="554.0" font-family="Cinzel, Cormorant Garamond, Georgia, serif" font-size="32.0" font-weight="400" fill="#0B1D34" letter-spacing="2.00">CURIOSIDAD</text><text x="130.0" y="600.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="16.0" font-weight="400" fill="#55585F" opacity="0.78">Preguntamos qué hay detrás antes de decidir.</text><line x1="130.0" y1="660.0" x2="623.3" y2="660.0" stroke="#0B1D34" stroke-width="0.70" opacity="0.12"/><text x="683.3" y="500.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="13.0" font-weight="600" fill="#B8912B" letter-spacing="2.00">02</text><text x="683.3" y="554.0" font-family="Cinzel, Cormorant Garamond, Georgia, serif" font-size="32.0" font-weight="400" fill="#0B1D34" letter-spacing="2.00">CRITERIO</text><text x="683.3" y="600.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="16.0" font-weight="400" fill="#55585F" opacity="0.78">Preferimos hacer menos y hacerlo bien.</text><line x1="683.3" y1="660.0" x2="1176.7" y2="660.0" stroke="#0B1D34" stroke-width="0.70" opacity="0.12"/><text x="1236.7" y="500.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="13.0" font-weight="600" fill="#B8912B" letter-spacing="2.00">03</text><text x="1236.7" y="554.0" font-family="Cinzel, Cormorant Garamond, Georgia, serif" font-size="32.0" font-weight="400" fill="#0B1D34" letter-spacing="2.00">CERCANÍA</text><text x="1236.7" y="600.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="16.0" font-weight="400" fill="#55585F" opacity="0.78">Tratamos con personas, no con cuentas.</text><line x1="1236.7" y1="660.0" x2="1730.0" y2="660.0" stroke="#0B1D34" stroke-width="0.70" opacity="0.12"/><text x="130.0" y="760.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="13.0" font-weight="600" fill="#B8912B" letter-spacing="2.00">04</text><text x="130.0" y="814.0" font-family="Cinzel, Cormorant Garamond, Georgia, serif" font-size="32.0" font-weight="400" fill="#0B1D34" letter-spacing="2.00">AMBICIÓN</text><text x="130.0" y="860.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="16.0" font-weight="400" fill="#55585F" opacity="0.78">No construimos un negocio: construimos un ecosistema.</text><line x1="130.0" y1="920.0" x2="623.3" y2="920.0" stroke="#0B1D34" stroke-width="0.70" opacity="0.12"/><text x="683.3" y="760.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="13.0" font-weight="600" fill="#B8912B" letter-spacing="2.00">05</text><text x="683.3" y="814.0" font-family="Cinzel, Cormorant Garamond, Georgia, serif" font-size="32.0" font-weight="400" fill="#0B1D34" letter-spacing="2.00">RIGOR</text><text x="683.3" y="860.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="16.0" font-weight="400" fill="#55585F" opacity="0.78">Números claros, procesos claros, promesas cumplidas.</text><line x1="683.3" y1="920.0" x2="1176.7" y2="920.0" stroke="#0B1D34" stroke-width="0.70" opacity="0.12"/><text x="1236.7" y="760.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="13.0" font-weight="600" fill="#B8912B" letter-spacing="2.00">06</text><text x="1236.7" y="814.0" font-family="Cinzel, Cormorant Garamond, Georgia, serif" font-size="32.0" font-weight="400" fill="#0B1D34" letter-spacing="2.00">APERTURA</text><text x="1236.7" y="860.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="16.0" font-weight="400" fill="#55585F" opacity="0.78">Nuestra perspectiva no termina en un solo mercado.</text><line x1="1236.7" y1="920.0" x2="1730.0" y2="920.0" stroke="#0B1D34" stroke-width="0.70" opacity="0.12"/></svg>