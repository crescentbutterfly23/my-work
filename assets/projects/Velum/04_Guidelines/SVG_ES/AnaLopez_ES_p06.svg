<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1279.97" height="720.00" viewBox="0 0 1279.97 720.00">
<title>AnaLopez ES page 06</title>
<rect x="0" y="0" width="1279.97" height="720.00" fill="#F5F0EA"/>
<text font-family="Poppins" font-size="14.00" font-weight="200" fill="#585C41" text-anchor="start" letter-spacing="4.200" xml:space="preserve">
<tspan x="86.40" y="70.52">LA CASA</tspan>
</text>
<text font-family="Bodoni Moda" font-size="45.33" font-weight="400" fill="#0D0D0C" text-anchor="start" xml:space="preserve">
<tspan x="86.40" y="142.69">Valores</tspan>
</text>
<text font-family="Poppins" font-size="16.00" font-weight="300" fill="#585C41" text-anchor="start" xml:space="preserve">
<tspan x="86.40" y="181.70">Lo que gobierna cada decision</tspan>
</text>
<rect x="86.40" y="225.60" width="253.75" height="190.08" fill="#EDE5DA"/>
<text font-family="Poppins" font-size="12.67" font-weight="200" fill="#B8762A" text-anchor="start" letter-spacing="3.040" xml:space="preserve">
<tspan x="117.12" y="266.44">01</tspan>
</text>
<text font-family="Bodoni Moda" font-size="25.33" font-weight="400" fill="#0D0D0C" text-anchor="start" xml:space="preserve">
<tspan x="117.12" y="313.92">Memoria</tspan>
</text>
<text font-family="Poppins" font-size="13.33" font-weight="300" fill="#585C41" text-anchor="start" xml:space="preserve">
<tspan x="117.12" y="347.08">Las historias personales son</tspan>
<tspan x="117.12" y="367.08">materia prima.</tspan>
</text>
<rect x="370.87" y="225.60" width="253.75" height="190.08" fill="#EDE5DA"/>
<text font-family="Poppins" font-size="12.67" font-weight="200" fill="#B8762A" text-anchor="start" letter-spacing="3.040" xml:space="preserve">
<tspan x="401.59" y="266.44">02</tspan>
</text>
<text font-family="Bodoni Moda" font-size="25.33" font-weight="400" fill="#0D0D0C" text-anchor="start" xml:space="preserve">
<tspan x="401.59" y="313.92">Herencia</tspan>
</text>
<text font-family="Poppins" font-size="13.33" font-weight="300" fill="#585C41" text-anchor="start" xml:space="preserve">
<tspan x="401.59" y="347.08">Se honra aquello que se</tspan>
<tspan x="401.59" y="367.08">transmite entre</tspan>
<tspan x="401.59" y="387.08">generaciones.</tspan>
</text>
<rect x="655.34" y="225.60" width="253.75" height="190.08" fill="#EDE5DA"/>
<text font-family="Poppins" font-size="12.67" font-weight="200" fill="#B8762A" text-anchor="start" letter-spacing="3.040" xml:space="preserve">
<tspan x="686.06" y="266.44">03</tspan>
</text>
<text font-family="Bodoni Moda" font-size="25.33" font-weight="400" fill="#0D0D0C" text-anchor="start" xml:space="preserve">
<tspan x="686.06" y="313.92">Cuba</tspan>
</text>
<text font-family="Poppins" font-size="13.33" font-weight="300" fill="#585C41" text-anchor="start" xml:space="preserve">
<tspan x="686.06" y="347.08">Origen, contexto y</tspan>
<tspan x="686.06" y="367.08">sensibilidad. No decoracion.</tspan>
</text>
<rect x="939.82" y="225.60" width="253.75" height="190.08" fill="#EDE5DA"/>
<text font-family="Poppins" font-size="12.67" font-weight="200" fill="#B8762A" text-anchor="start" letter-spacing="3.040" xml:space="preserve">
<tspan x="970.54" y="266.44">04</tspan>
</text>
<text font-family="Bodoni Moda" font-size="25.33" font-weight="400" fill="#0D0D0C" text-anchor="start" xml:space="preserve">
<tspan x="970.54" y="313.92">Ciencia</tspan>
</text>
<text font-family="Poppins" font-size="13.33" font-weight="300" fill="#585C41" text-anchor="start" xml:space="preserve">
<tspan x="970.54" y="347.08">Bioquimica y biologia</tspan>
<tspan x="970.54" y="367.08">molecular como base real.</tspan>
</text>
<rect x="86.40" y="440.64" width="253.75" height="190.08" fill="#EDE5DA"/>
<text font-family="Poppins" font-size="12.67" font-weight="200" fill="#B8762A" text-anchor="start" letter-spacing="3.040" xml:space="preserve">
<tspan x="117.12" y="481.48">05</tspan>
</text>
<text font-family="Bodoni Moda" font-size="25.33" font-weight="400" fill="#0D0D0C" text-anchor="start" xml:space="preserve">
<tspan x="117.12" y="528.96">Artesania</tspan>
</text>
<text font-family="Poppins" font-size="13.33" font-weight="300" fill="#585C41" text-anchor="start" xml:space="preserve">
<tspan x="117.12" y="562.12">La formula y la ejecucion</tspan>
<tspan x="117.12" y="582.12">importan tanto como la</tspan>
<tspan x="117.12" y="602.12">historia.</tspan>
</text>
<rect x="370.87" y="440.64" width="253.75" height="190.08" fill="#EDE5DA"/>
<text font-family="Poppins" font-size="12.67" font-weight="200" fill="#B8762A" text-anchor="start" letter-spacing="3.040" xml:space="preserve">
<tspan x="401.59" y="481.48">06</tspan>
</text>
<text font-family="Bodoni Moda" font-size="25.33" font-weight="400" fill="#0D0D0C" text-anchor="start" xml:space="preserve">
<tspan x="401.59" y="528.96">Elegancia</tspan>
</text>
<text font-family="Poppins" font-size="13.33" font-weight="300" fill="#585C41" text-anchor="start" xml:space="preserve">
<tspan x="401.59" y="562.12">Refinada sin ser ostentosa.</tspan>
</text>
<rect x="655.34" y="440.64" width="253.75" height="190.08" fill="#EDE5DA"/>
<text font-family="Poppins" font-size="12.67" font-weight="200" fill="#B8762A" text-anchor="start" letter-spacing="3.040" xml:space="preserve">
<tspan x="686.06" y="481.48">07</tspan>
</text>
<text font-family="Bodoni Moda" font-size="25.33" font-weight="400" fill="#0D0D0C" text-anchor="start" xml:space="preserve">
<tspan x="686.06" y="528.96">Autenticidad</tspan>
</text>
<text font-family="Poppins" font-size="13.33" font-weight="300" fill="#585C41" text-anchor="start" xml:space="preserve">
<tspan x="686.06" y="562.12">La historia fundacional se</tspan>
<tspan x="686.06" y="582.12">mantiene verdadera.</tspan>
</text>
<rect x="939.82" y="440.64" width="253.75" height="190.08" fill="#EDE5DA"/>
<text font-family="Poppins" font-size="12.67" font-weight="200" fill="#B8762A" text-anchor="start" letter-spacing="3.040" xml:space="preserve">
<tspan x="970.54" y="481.48">08</tspan>
</text>
<text font-family="Bodoni Moda" font-size="25.33" font-weight="400" fill="#0D0D0C" text-anchor="start" xml:space="preserve">
<tspan x="970.54" y="528.96">Evolucion</tspan>
</text>
<text font-family="Poppins" font-size="13.33" font-weight="300" fill="#585C41" text-anchor="start" xml:space="preserve">
<tspan x="970.54" y="562.12">Nace del pasado, pero no</tspan>
<tspan x="970.54" y="582.12">queda atrapada en el.</tspan>
</text>
<text font-family="Poppins" font-size="11.33" font-weight="300" fill="#585C41" text-anchor="start" xml:space="preserve">
<tspan x="86.40" y="686.14">AnaLopez  ·  Manual de Marca</tspan>
</text>
<text font-family="Poppins" font-size="11.33" font-weight="300" fill="#585C41" text-anchor="end" xml:space="preserve">
<tspan x="1193.57" y="686.14">06</tspan>
</text>
</svg>