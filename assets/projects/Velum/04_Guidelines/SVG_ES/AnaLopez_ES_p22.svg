<text font-family="Poppins" font-size="13.33" font-weight="300" fill="#585C41" text-anchor="start" xml:space="preserve">
<tspan x="850.11" y="541.96">El descriptor, en ExtraLight con tracking de 0.30 em.</tspan>
<tspan x="850.11" y="561.96">Tambien etiquetas, navegacion, listas de</tspan>
