</text>
<text font-family="Poppins" font-size="12.67" font-weight="200" fill="#B8762A" text-anchor="start" letter-spacing="3.293" xml:space="preserve">
<tspan x="468.26" y="441.16">DISPLAY Y EDITORIAL</tspan>
</text>
<text font-family="Bodoni Moda" font-size="13.33" font-weight="400" fill="#492B17" text-anchor="start" xml:space="preserve">
<tspan x="468.26" y="480.44">ABCDEFGHIJKLM abcdefghijklm 0123456789</tspan>
</text>
<text font-family="Poppins" font-size="13.33" font-weight="300" fill="#585C41" text-anchor="start" xml:space="preserve">
<tspan x="468.26" y="541.96">Titulares, nombres de coleccion, citas y lineas de</tspan>
<tspan x="468.26" y="561.96">campana. Aporta la z con swash del logotipo. Por</tspan>
<tspan x="468.26" y="581.96">debajo de 18 px sus finos se rompen.</tspan>
</text>
<rect x="850.11" y="220.80" width="343.46" height="144.00" fill="#EDE5DA"/>
