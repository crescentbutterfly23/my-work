</text>
<text font-family="Italiana" font-size="13.33" font-weight="400" fill="#492B17" text-anchor="start" xml:space="preserve">
<tspan x="86.40" y="477.82">ABCDEFGHIJKLM abcdefghijklm 0123456789</tspan>
</text>
<text font-family="Poppins" font-size="13.33" font-weight="300" fill="#585C41" text-anchor="start" xml:space="preserve">
<tspan x="86.40" y="541.96">Base del logotipo. Fuera de el, solo para numerales</tspan>
<tspan x="86.40" y="561.96">muy grandes o el titulo de una coleccion, a 40 px o</tspan>
<tspan x="86.40" y="581.96">mas. Nunca para texto.</tspan>
</text>
<rect x="468.26" y="220.80" width="343.46" height="144.00" fill="#EDE5DA"/>
<text font-family="Bodoni Moda" font-size="72.00" font-weight="400" fill="#0D0D0C" text-anchor="middle" xml:space="preserve">
