</text>
<text font-family="Poppins" font-size="14.67" font-weight="300" fill="#0D0D0C" text-anchor="start" xml:space="preserve">
<tspan x="399.19" y="322.91">Estirar, comprimir o</tspan>
<tspan x="399.19" y="344.18">inclinar</tspan>
</text>
<rect x="654.38" y="225.60" width="255.19" height="182.40" fill="#EDE5DA"/>
