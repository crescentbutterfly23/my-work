<tspan x="115.20" y="534.11">Usar mas de un color</tspan>
</text>
<rect x="370.39" y="436.80" width="255.19" height="182.40" fill="#EDE5DA"/>
<text font-family="Poppins" font-size="17.33" font-weight="400" fill="#492B17" text-anchor="start" xml:space="preserve">
<tspan x="399.19" y="482.01">×</tspan>
</text>
<text font-family="Poppins" font-size="14.67" font-weight="300" fill="#0D0D0C" text-anchor="start" xml:space="preserve">
<tspan x="399.19" y="534.11">Cambiar el descriptor de</tspan>
<tspan x="399.19" y="555.38">sitio o tamano</tspan>
</text>
