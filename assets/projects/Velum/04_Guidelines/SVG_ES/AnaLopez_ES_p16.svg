</text>
<text font-family="Poppins" font-size="14.67" font-weight="300" fill="#0D0D0C" text-anchor="start" xml:space="preserve">
<tspan x="683.18" y="534.11">Colocarlo sobre una foto</tspan>
<tspan x="683.18" y="555.38">ocupada</tspan>
</text>
