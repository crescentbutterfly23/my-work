<text font-family="Bodoni Moda" font-size="26.67" font-weight="400" fill="#585C41" text-anchor="middle" xml:space="preserve">
<tspan x="169.86" y="287.83">01</tspan>
</text>
<text font-family="Bodoni Moda" font-size="20.00" font-weight="400" fill="#0D0D0C" text-anchor="start" xml:space="preserve">
<tspan x="86.40" y="368.29">Flor</tspan>
</text>
<text font-family="Poppins" font-size="12.00" font-weight="300" fill="#585C41" text-anchor="start" xml:space="preserve">
<tspan x="86.40" y="393.25">Jazmin. Memoria y origen.</tspan>
</text>
<rect x="274.45" y="220.80" width="166.93" height="110.40" fill="#EDE5DA"/>
<text font-family="Bodoni Moda" font-size="26.67" font-weight="400" fill="#585C41" text-anchor="middle" xml:space="preserve">
<tspan x="357.91" y="287.83">02</tspan>
</text>
<text font-family="Bodoni Moda" font-size="20.00" font-weight="400" fill="#0D0D0C" text-anchor="start" xml:space="preserve">
<tspan x="274.45" y="368.29">Naturaleza</tspan>
</text>
<text font-family="Poppins" font-size="12.00" font-weight="300" fill="#585C41" text-anchor="start" xml:space="preserve">
<tspan x="274.45" y="393.25">Hoja. Jardin y botanica.</tspan>
</text>
<rect x="462.50" y="220.80" width="166.93" height="110.40" fill="#EDE5DA"/>
<text font-family="Bodoni Moda" font-size="26.67" font-weight="400" fill="#585C41" text-anchor="middle" xml:space="preserve">
<tspan x="545.96" y="287.83">03</tspan>
</text>
<text font-family="Bodoni Moda" font-size="20.00" font-weight="400" fill="#0D0D0C" text-anchor="start" xml:space="preserve">
<tspan x="462.50" y="368.29">Ciencia</tspan>
</text>
<text font-family="Poppins" font-size="12.00" font-weight="300" fill="#585C41" text-anchor="start" xml:space="preserve">
<tspan x="462.50" y="393.25">Matraz. Formulacion y</tspan>
<tspan x="462.50" y="410.65">biologia.</tspan>
</text>
<rect x="650.54" y="220.80" width="166.93" height="110.40" fill="#EDE5DA"/>
<text font-family="Bodoni Moda" font-size="26.67" font-weight="400" fill="#585C41" text-anchor="middle" xml:space="preserve">
<tspan x="734.01" y="287.83">04</tspan>
</text>
<text font-family="Bodoni Moda" font-size="20.00" font-weight="400" fill="#0D0D0C" text-anchor="start" xml:space="preserve">
<tspan x="650.54" y="368.29">Tabaco</tspan>
</text>
<text font-family="Poppins" font-size="12.00" font-weight="300" fill="#585C41" text-anchor="start" xml:space="preserve">
<tspan x="650.54" y="393.25">Hoja de tabaco. Ritual y</tspan>
<tspan x="650.54" y="410.65">tierra.</tspan>
</text>
<rect x="838.59" y="220.80" width="166.93" height="110.40" fill="#EDE5DA"/>
<text font-family="Bodoni Moda" font-size="26.67" font-weight="400" fill="#585C41" text-anchor="middle" xml:space="preserve">
<tspan x="922.06" y="287.83">05</tspan>
</text>
<text font-family="Bodoni Moda" font-size="20.00" font-weight="400" fill="#0D0D0C" text-anchor="start" xml:space="preserve">
<tspan x="838.59" y="368.29">Cafe</tspan>
</text>
<text font-family="Poppins" font-size="12.00" font-weight="300" fill="#585C41" text-anchor="start" xml:space="preserve">
<tspan x="838.59" y="393.25">Grano. Manana y hogar.</tspan>
</text>
<rect x="1026.64" y="220.80" width="166.93" height="110.40" fill="#EDE5DA"/>
<text font-family="Bodoni Moda" font-size="26.67" font-weight="400" fill="#585C41" text-anchor="middle" xml:space="preserve">
<tspan x="1110.10" y="287.83">06</tspan>
</text>
<text font-family="Bodoni Moda" font-size="20.00" font-weight="400" fill="#0D0D0C" text-anchor="start" xml:space="preserve">
<tspan x="1026.64" y="368.29">Cacao</tspan>
</text>
<text font-family="Poppins" font-size="12.00" font-weight="300" fill="#585C41" text-anchor="start" xml:space="preserve">
<tspan x="1026.64" y="393.25">Vaina. Calidez y placer.</tspan>
</text>
<text font-family="Poppins" font-size="14.67" font-weight="300" fill="#585C41" text-anchor="start" xml:space="preserve">
<tspan x="86.40" y="490.91">Seis temas cubren todo el universo de la casa. Se dibujan a linea, con el mismo</tspan>
<tspan x="86.40" y="513.64">grosor que el jazmin, sobre una retina de 24 px.</tspan>
</text>
<text font-family="Poppins" font-size="12.67" font-weight="200" fill="#B8762A" text-anchor="start" letter-spacing="3.293" xml:space="preserve">
<tspan x="710.40" y="489.16">ESPECIFICACION</tspan>
</text>
<text font-family="Poppins" font-size="13.33" font-weight="300" fill="#585C41" text-anchor="start" xml:space="preserve">
<tspan x="710.40" y="522.76">—  Retina de 24 px, trazo de 1.5 px</tspan>
</text>
<text font-family="Poppins" font-size="13.33" font-weight="300" fill="#585C41" text-anchor="start" xml:space="preserve">
<tspan x="710.40" y="555.40">—  Terminaciones redondas, sin relleno</tspan>
</text>
<text font-family="Poppins" font-size="13.33" font-weight="300" fill="#585C41" text-anchor="start" xml:space="preserve">
<tspan x="710.40" y="588.04">—  Un solo color de la paleta</tspan>
</text>
<text font-family="Poppins" font-size="13.33" font-weight="300" fill="#585C41" text-anchor="start" xml:space="preserve">
<tspan x="710.40" y="620.68">—  Mismo peso visual que el jazmin dibujado</tspan>
</text>
<text font-family="Poppins" font-size="12.67" font-weight="300" fill="#492B17" text-anchor="start" xml:space="preserve">
<tspan x="86.40" y="647.56">Pendiente: dibujar los seis iconos. Hoy solo existe la especificacion.</tspan>
</text>
<text font-family="Poppins" font-size="11.33" font-weight="300" fill="#585C41" text-anchor="start" xml:space="preserve">
<tspan x="86.40" y="686.14">AnaLopez  ·  Manual de Marca</tspan>
</text>
<text font-family="Poppins" font-size="11.33" font-weight="300" fill="#585C41" text-anchor="end" xml:space="preserve">
<tspan x="1193.57" y="686.14">32</tspan>
</text>
