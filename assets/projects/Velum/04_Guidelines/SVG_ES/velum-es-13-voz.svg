<rect width="1920" height="1080" fill="url(#gGround)"/><line x1="130.0" y1="78.0" x2="1790.0" y2="78.0" stroke="#0B1D34" stroke-width="0.80" opacity="0.28"/><text x="130.0" y="68.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="11.0" font-weight="600" fill="#B8912B" letter-spacing="3.40">01 — LA MARCA</text><text x="1790.0" y="68.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="11.0" font-weight="500" fill="#0B1D34" letter-spacing="3.40" text-anchor="end">MANUAL DE MARCA</text><line x1="130.0" y1="1006.0" x2="1790.0" y2="1006.0" stroke="#0B1D34" stroke-width="0.80" opacity="0.18"/><text x="130.0" y="1032.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="10.0" font-weight="500" fill="#0B1D34" letter-spacing="3.40">VELUM ENTERPRISE</text><text x="1790.0" y="1034.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="15.0" font-weight="600" fill="#0B1D34" letter-spacing="1.00" text-anchor="end">13</text><text x="1754.0" y="1034.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="15.0" font-weight="400" fill="#0B1D34" letter-spacing="1.00" text-anchor="end" opacity="0.40">/ 36</text><text x="130.0" y="210.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="12.0" font-weight="600" fill="#B8912B" letter-spacing="3.40">VOZ Y TONO</text><text x="130.0" y="300.0" font-family="Cinzel, Cormorant Garamond, Georgia, serif" font-size="52.0" font-weight="400" fill="#0B1D34" letter-spacing="2.50">CÓMO ESCRIBIMOS</text><text x="130.0" y="356.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="16.0" font-weight="400" fill="#55585F" opacity="0.78">Inspirador, sofisticado y cercano. Hablamos con visión, confianza y propósito;</text><text x="130.0" y="383.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="16.0" font-weight="400" fill="#55585F" opacity="0.78">nunca necesitamos gritar para establecer valor.</text><line x1="130.0" y1="450.0" x2="1790.0" y2="450.0" stroke="#0B1D34" stroke-width="0.70" opacity="0.18"/><text x="130.0" y="520.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="10.0" font-weight="600" fill="#B8912B" letter-spacing="3.40">MEJOR</text><text x="130.0" y="566.0" font-family="Cormorant Garamond, Georgia, serif" font-size="25.0" font-weight="400" fill="#0B1D34" font-style="italic">«Hay un mundo detrás de cada horizonte.»</text><text x="1030.0" y="520.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="10.0" font-weight="600" fill="#8C5A3C" letter-spacing="3.40">PEOR</text><text x="1030.0" y="566.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="21.0" font-weight="400" fill="#55585F" opacity="0.85">«Somos líderes en múltiples industrias.»</text><line x1="130.0" y1="606.0" x2="1790.0" y2="606.0" stroke="#0B1D34" stroke-width="0.70" opacity="0.12"/><text x="130.0" y="670.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="10.0" font-weight="600" fill="#B8912B" letter-spacing="3.40">MEJOR</text><text x="130.0" y="716.0" font-family="Cormorant Garamond, Georgia, serif" font-size="25.0" font-weight="400" fill="#0B1D34" font-style="italic">«Un espacio puede convertirse en un destino.»</text><text x="1030.0" y="670.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="10.0" font-weight="600" fill="#8C5A3C" letter-spacing="3.40">PEOR</text><text x="1030.0" y="716.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="21.0" font-weight="400" fill="#55585F" opacity="0.85">«Soluciones integrales 360°.»</text><line x1="130.0" y1="756.0" x2="1790.0" y2="756.0" stroke="#0B1D34" stroke-width="0.70" opacity="0.12"/><text x="130.0" y="820.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="10.0" font-weight="600" fill="#B8912B" letter-spacing="3.40">MEJOR</text><text x="130.0" y="866.0" font-family="Cormorant Garamond, Georgia, serif" font-size="25.0" font-weight="400" fill="#0B1D34" font-style="italic">«Seis casas, un mismo criterio.»</text><text x="1030.0" y="820.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="10.0" font-weight="600" fill="#8C5A3C" letter-spacing="3.40">PEOR</text><text x="1030.0" y="866.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="21.0" font-weight="400" fill="#55585F" opacity="0.85">«Sinergias de nuestro portafolio diversificado.»</text><line x1="130.0" y1="906.0" x2="1790.0" y2="906.0" stroke="#0B1D34" stroke-width="0.70" opacity="0.12"/><text x="130.0" y="940.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="11.0" font-weight="600" fill="#B8912B" letter-spacing="3.40">REGLAS</text><text x="330.0" y="940.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="15.0" font-weight="400" fill="#55585F">— Frases cortas. Una idea por frase.</text><text x="1130.0" y="940.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="15.0" font-weight="400" fill="#55585F">— Concreto antes que abstracto: un ejemplo vale más que un adjetivo.</text><text x="330.0" y="974.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="15.0" font-weight="400" fill="#55585F">— Sin superlativos vacíos ni jerga corporativa.</text><text x="1130.0" y="974.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="15.0" font-weight="400" fill="#55585F">— El nombre se escribe Velum, nunca VELUM en texto corrido.</text></svg>