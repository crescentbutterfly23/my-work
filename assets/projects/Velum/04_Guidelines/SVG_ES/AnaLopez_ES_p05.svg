<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1279.97" height="720.00" viewBox="0 0 1279.97 720.00">
<title>AnaLopez ES page 05</title>
<rect x="0" y="0" width="1279.97" height="720.00" fill="#F5F0EA"/>
<text font-family="Poppins" font-size="14.00" font-weight="200" fill="#585C41" text-anchor="start" letter-spacing="4.200" xml:space="preserve">
<tspan x="86.40" y="70.52">LA CASA</tspan>
</text>
<text font-family="Bodoni Moda" font-size="45.33" font-weight="400" fill="#0D0D0C" text-anchor="start" xml:space="preserve">
<tspan x="86.40" y="142.69">Proposito, vision y mision</tspan>
</text>
<rect x="86.40" y="211.20" width="342.18" height="321.60" fill="#EDE5DA"/>
<text font-family="Poppins" font-size="14.67" font-weight="200" fill="#B8762A" text-anchor="start" letter-spacing="3.520" xml:space="preserve">
<tspan x="124.80" y="260.51">01</tspan>
</text>
<text font-family="Bodoni Moda" font-size="30.67" font-weight="400" fill="#0D0D0C" text-anchor="start" xml:space="preserve">
<tspan x="124.80" y="322.91">Proposito</tspan>
</text>
<text font-family="Poppins" font-size="15.33" font-weight="300" fill="#585C41" text-anchor="start" xml:space="preserve">
<tspan x="124.80" y="373.70">Preservar emociones y memorias</tspan>
<tspan x="124.80" y="398.24">a traves del lenguaje universal</tspan>
<tspan x="124.80" y="422.77">del perfume.</tspan>
</text>
<rect x="468.90" y="211.20" width="342.18" height="321.60" fill="#EDE5DA"/>
<text font-family="Poppins" font-size="14.67" font-weight="200" fill="#B8762A" text-anchor="start" letter-spacing="3.520" xml:space="preserve">
<tspan x="507.30" y="260.51">02</tspan>
</text>
<text font-family="Bodoni Moda" font-size="30.67" font-weight="400" fill="#0D0D0C" text-anchor="start" xml:space="preserve">
<tspan x="507.30" y="322.91">Vision</tspan>
</text>
<text font-family="Poppins" font-size="15.33" font-weight="300" fill="#585C41" text-anchor="start" xml:space="preserve">
<tspan x="507.30" y="373.70">Ser una casa de perfumeria de</tspan>
<tspan x="507.30" y="398.24">referencia nacida en Cuba,</tspan>
<tspan x="507.30" y="422.77">reconocida por su identidad</tspan>
<tspan x="507.30" y="447.30">olfativa y su narrativa emocional.</tspan>
</text>
<rect x="851.39" y="211.20" width="342.18" height="321.60" fill="#EDE5DA"/>
<text font-family="Poppins" font-size="14.67" font-weight="200" fill="#B8762A" text-anchor="start" letter-spacing="3.520" xml:space="preserve">
<tspan x="889.79" y="260.51">03</tspan>
</text>
<text font-family="Bodoni Moda" font-size="30.67" font-weight="400" fill="#0D0D0C" text-anchor="start" xml:space="preserve">
<tspan x="889.79" y="322.91">Mision</tspan>
</text>
<text font-family="Poppins" font-size="15.33" font-weight="300" fill="#585C41" text-anchor="start" xml:space="preserve">
<tspan x="889.79" y="373.70">Crear fragancias que unan</tspan>
<tspan x="889.79" y="398.24">memoria, ciencia, cultura,</tspan>
<tspan x="889.79" y="422.77">artesania y diseno</tspan>
<tspan x="889.79" y="447.30">contemporaneo.</tspan>
</text>
<text font-family="Poppins" font-size="11.33" font-weight="300" fill="#585C41" text-anchor="start" xml:space="preserve">
<tspan x="86.40" y="686.14">AnaLopez  ·  Manual de Marca</tspan>
</text>
<text font-family="Poppins" font-size="11.33" font-weight="300" fill="#585C41" text-anchor="end" xml:space="preserve">
<tspan x="1193.57" y="686.14">05</tspan>
</text>
</svg>