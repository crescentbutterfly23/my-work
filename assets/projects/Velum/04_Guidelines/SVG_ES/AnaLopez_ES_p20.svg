<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1279.97" height="720.00" viewBox="0 0 1279.97 720.00">
<title>AnaLopez ES page 20</title>
<rect x="0" y="0" width="1279.97" height="720.00" fill="#F5F0EA"/>
<text font-family="Poppins" font-size="14.00" font-weight="200" fill="#585C41" text-anchor="start" letter-spacing="4.200" xml:space="preserve">
<tspan x="86.40" y="70.52">COLOR</tspan>
</text>
<text font-family="Bodoni Moda" font-size="45.33" font-weight="400" fill="#0D0D0C" text-anchor="start" xml:space="preserve">
<tspan x="86.40" y="142.69">Proporcion y combinacion</tspan>
</text>
<text font-family="Poppins" font-size="16.00" font-weight="300" fill="#585C41" text-anchor="start" xml:space="preserve">
<tspan x="86.40" y="184.58">El sistema es sobrio por construccion. Una superficie clara domina, un oscuro ancla, y el</tspan>
<tspan x="86.40" y="209.38">Ambar aparece una sola vez por pieza.</tspan>
</text>
<rect x="85.25" y="253.25" width="417.02" height="50.30" fill="#D6BD9A"/>
<rect x="86.40" y="254.40" width="414.72" height="48.00" fill="#EDE5DA"/>
<text font-family="Bodoni Moda" font-size="21.33" font-weight="400" fill="#0D0D0C" text-anchor="start" xml:space="preserve">
<tspan x="792.00" y="283.72">60%</tspan>
</text>
<text font-family="Poppins" font-size="14.00" font-weight="500" fill="#0D0D0C" text-anchor="start" xml:space="preserve">
<tspan x="868.80" y="271.16">Blanco Cal o Jazmin</tspan>
</text>
<text font-family="Poppins" font-size="12.00" font-weight="300" fill="#585C41" text-anchor="start" xml:space="preserve">
<tspan x="868.80" y="296.29">Superficie. Papel, fondo, espacio en blanco.</tspan>
</text>
<rect x="85.25" y="335.81" width="175.10" height="50.30" fill="#D6BD9A"/>
<rect x="86.40" y="336.96" width="172.80" height="48.00" fill="#1C2417"/>
<text font-family="Bodoni Moda" font-size="21.33" font-weight="400" fill="#0D0D0C" text-anchor="start" xml:space="preserve">
<tspan x="792.00" y="366.28">25%</tspan>
</text>
<text font-family="Poppins" font-size="14.00" font-weight="500" fill="#0D0D0C" text-anchor="start" xml:space="preserve">
<tspan x="868.80" y="353.72">Verde Profundo o Negro</tspan>
</text>
<text font-family="Poppins" font-size="12.00" font-weight="300" fill="#585C41" text-anchor="start" xml:space="preserve">
<tspan x="868.80" y="378.85">Ancla. Estuches, tipografia, bloques oscuros.</tspan>
</text>
<rect x="85.25" y="418.37" width="71.42" height="50.30" fill="#D6BD9A"/>
<rect x="86.40" y="419.52" width="69.12" height="48.00" fill="#585C41"/>
<text font-family="Bodoni Moda" font-size="21.33" font-weight="400" fill="#0D0D0C" text-anchor="start" xml:space="preserve">
<tspan x="792.00" y="448.84">10%</tspan>
</text>
<text font-family="Poppins" font-size="14.00" font-weight="500" fill="#0D0D0C" text-anchor="start" xml:space="preserve">
<tspan x="868.80" y="436.28">Oliva, Cacao o Arena</tspan>
</text>
<text font-family="Poppins" font-size="12.00" font-weight="300" fill="#585C41" text-anchor="start" xml:space="preserve">
<tspan x="868.80" y="461.41">Apoyo. Materias, texturas, secundarios.</tspan>
</text>
<rect x="85.25" y="500.93" width="36.86" height="50.30" fill="#D6BD9A"/>
<rect x="86.40" y="502.08" width="34.56" height="48.00" fill="#B8762A"/>
<text font-family="Bodoni Moda" font-size="21.33" font-weight="400" fill="#0D0D0C" text-anchor="start" xml:space="preserve">
<tspan x="792.00" y="531.40">5%</tspan>
</text>
<text font-family="Poppins" font-size="14.00" font-weight="500" fill="#0D0D0C" text-anchor="start" xml:space="preserve">
<tspan x="868.80" y="518.84">Ambar</tspan>
</text>
<text font-family="Poppins" font-size="12.00" font-weight="300" fill="#585C41" text-anchor="start" xml:space="preserve">
<tspan x="868.80" y="543.97">Acento unico. Foil, detalle, una sola vez.</tspan>
</text>
<text font-family="Poppins" font-size="14.00" font-weight="200" fill="#B8762A" text-anchor="start" letter-spacing="3.920" xml:space="preserve">
<tspan x="86.40" y="605.24">NUNCA</tspan>
</text>
<text font-family="Poppins" font-size="12.67" font-weight="300" fill="#585C41" text-anchor="start" xml:space="preserve">
<tspan x="86.40" y="642.76">×  Ambar como fondo de una pieza</tspan>
<tspan x="86.40" y="660.50">entera</tspan>
</text>
<text font-family="Poppins" font-size="12.67" font-weight="300" fill="#585C41" text-anchor="start" xml:space="preserve">
<tspan x="370.39" y="642.76">×  Cacao y Verde Profundo juntos en</tspan>
<tspan x="370.39" y="660.50">gran superficie</tspan>
</text>
<text font-family="Poppins" font-size="12.67" font-weight="300" fill="#585C41" text-anchor="start" xml:space="preserve">
<tspan x="654.38" y="642.76">×  Mas de tres colores de la paleta en</tspan>
<tspan x="654.38" y="660.50">una misma pieza</tspan>
</text>
<text font-family="Poppins" font-size="12.67" font-weight="300" fill="#585C41" text-anchor="start" xml:space="preserve">
<tspan x="938.38" y="642.76">×  Degradados entre colores de marca</tspan>
</text>
<text font-family="Poppins" font-size="11.33" font-weight="300" fill="#585C41" text-anchor="start" xml:space="preserve">
<tspan x="86.40" y="686.14">AnaLopez  ·  Manual de Marca</tspan>
</text>
<text font-family="Poppins" font-size="11.33" font-weight="300" fill="#585C41" text-anchor="end" xml:space="preserve">
<tspan x="1193.57" y="686.14">20</tspan>
</text>
</svg>