F">Calidez. Etiquetas, estuches, paneles suaves.</text><line x1="130.0" y1="776.0" x2="1790.0" y2="776.0" stroke="#0B1D34" stroke-width="0.70" opacity="0.12"/><text x="130.0" y="828.0" font-family="Cinzel, Cormorant Garamond, Georgia, serif" font-size="26.0" font-weight="400" fill="#B8912B" letter-spacing="1.50">5%</text><text x="260.0" y="828.0" font-family="Cinzel, Cormorant Garamond, Georgia, serif" font-size="20.0" font-weight="400" fill="#0B1D34" letter-spacing="1.50">ORO VELUM</text><text x="650.0" y="828.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="16.0" font-weight="400" fill="#55585F">Acento. Una sola aparición por pieza.</text><line x1="130.0" y1="852.0" x2="1790.0" y2="852.0" stroke="#0B1D34" stroke-width="0.70" opacity="0.12"/><text x="130.0" y="904.0" font-family="Cinzel, Cormorant Garamond, Georgia, serif" font-size="26.0" font-weight="400" fill="#B8912B" letter-spacing="1.50">3%</text><text x="260.0" y="904.0" font-family="Cinzel, Cormorant Garamond, Georgia, serif" font-size="20.0" font-weight="400" fill="#0B1D34" letter-spacing="1.50">AZUL MEDIO</text><text x="650.0" y="904.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="16.0" font-weight="400" fill="#55585F">Apoyo. Sellos y bloques secundarios.</text><line x1="130.0" y1="928.0" x2="1790.0" y2="928.0" stroke="#0B1D34" stroke-width="0.70" opacity="0.12"/><text x="130.0" y="990.0" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="11.0" font-weight="600" fill="#B8912B" letter-spacing="3.40">COMBINACIONES QUE FUNCIONAN</text><rect x="430.0" y="954.0" width="210.0" height="56.0" fill="#F4F0EE" stroke="#0B1D34" stroke-width="0.60"/><text x="535.0" y="990.0" font-family="Cinzel, Cormorant Garamond, Georgia, serif" font-size="26.0" font-weight="400" fill="#0B1D34" letter-spacing="2.00" text-anchor="middle">Aa</text><rect x="670.0" y="954.0" width="210.0" height="56.0" fill="#0B1D34" stroke="#0B1D34" stroke-width="0.60"/><text x="775.0" y="990.0" font-fa